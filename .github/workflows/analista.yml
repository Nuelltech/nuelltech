name: Analista (Brain)
on:
  schedule:
    - cron: '0 9 * * *'
  workflow_dispatch:
    inputs:
      setor:
        description: 'Setor a analisar (ex: farmacias, restaurantes). Deixar vazio para todos.'
        required: false
        type: string
        default: ''
      status:
        description: 'Estado dos artigos (ex: Novo, Teste, Processado). Padrão: Novo'
        required: false
        type: string
        default: 'Novo'
      data_inicio:
        description: 'Data inicial em formato YYYY-MM-DD. Deixar vazio para sem limite.'
        required: false
        type: string
        default: ''
      data_fim:
        description: 'Data final em formato YYYY-MM-DD. Deixar vazio para sem limite.'
        required: false
        type: string
        default: ''

jobs:
  run-analista:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with: {python-version: '3.9'}
      - name: Install
        run: pip install anthropic notion-client
      - name: Executar
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          CONTEXTO_PAGE_ID: ${{ secrets.CONTEXTO_PAGE_ID || secrets.NOTION_CONTEXTO_PAGE_ID }}
          NOTION_CONTEXTO_PAGE_ID: ${{ secrets.NOTION_CONTEXTO_PAGE_ID || secrets.CONTEXTO_PAGE_ID }}

          NOTION_ANALISTA_C0: ${{ secrets.NOTION_ANALISTA_C0 }}
          NOTION_ANALISTA_C1: ${{ secrets.NOTION_ANALISTA_C1 }}
          NOTION_ANALISTA_C2: ${{ secrets.NOTION_ANALISTA_C2 }}
          NOTION_ANALISTA_C3: ${{ secrets.NOTION_ANALISTA_C3 }}
          NOTION_ANALISTA_C4: ${{ secrets.NOTION_ANALISTA_C4 }}
          NOTION_ANALISTA_C5: ${{ secrets.NOTION_ANALISTA_C5 }}
          NOTION_ANALISTA_C6: ${{ secrets.NOTION_ANALISTA_C6 }}
          NOTION_ANALISTA_C7: ${{ secrets.NOTION_ANALISTA_C7 }}
          NOTION_ANALISTA_C8_OUTPUT: ${{ secrets.NOTION_ANALISTA_C8_OUTPUT }}

          NOTION_SEC_FARM: ${{ secrets.NOTION_SEC_FARM }}
          NOTION_SEC_CLI: ${{ secrets.NOTION_SEC_CLI }}
          NOTION_SEC_REST: ${{ secrets.NOTION_SEC_REST }}
          NOTION_SEC_ECOM: ${{ secrets.NOTION_SEC_ECOM }}

          NOTION_TAX_FARM: ${{ secrets.NOTION_TAX_FARM }}
          NOTION_TAX_CLI: ${{ secrets.NOTION_TAX_CLI }}
          NOTION_TAX_REST: ${{ secrets.NOTION_TAX_REST }}
          NOTION_TAX_ECOM: ${{ secrets.NOTION_TAX_ECOM }}


          INPUT_SETOR: ${{ github.event.inputs.setor }}
          INPUT_STATUS: ${{ github.event.inputs.status }}
          INPUT_DATA_INICIO: ${{ github.event.inputs.data_inicio }}
          INPUT_DATA_FIM: ${{ github.event.inputs.data_fim }}
        run: |
          ARGS=()
          if [ -n "$INPUT_SETOR" ]; then ARGS+=(--setor "$INPUT_SETOR"); fi
          if [ -n "$INPUT_STATUS" ]; then ARGS+=(--status "$INPUT_STATUS"); else ARGS+=(--status "Novo"); fi
          if [ -n "$INPUT_DATA_INICIO" ]; then ARGS+=(--data-inicio "$INPUT_DATA_INICIO"); fi
          if [ -n "$INPUT_DATA_FIM" ]; then ARGS+=(--data-fim "$INPUT_DATA_FIM"); fi
          python scripts/analista.py "${ARGS[@]}"


